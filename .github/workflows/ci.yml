# Continuous integration (TECH-09): every push runs the lint, the type
# check and the unit tests. Pull requests are checked the same way.
name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Some unit tests use a real database (test/setup.ts only accepts one
    # whose name ends in _test).
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: typeracer
          POSTGRES_PASSWORD: typeracer
          POSTGRES_DB: typeracer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U typeracer"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgres://typeracer:typeracer@localhost:5432/typeracer_test

    steps:
      - uses: actions/checkout@v7

      # Same Bun version as the packageManager field in package.json.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # next and drizzle-kit run on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      # next typegen writes the route types (PageProps, LayoutProps) that
      # tsc needs; they live in .next/, which is not in the repository.
      - name: Type check
        run: bun run typecheck

      - name: Apply migrations to the test database
        run: bun run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Unit tests
        run: bun test
