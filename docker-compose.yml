services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: typeracer
      POSTGRES_PASSWORD: typeracer
      POSTGRES_DB: typeracer
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeracer"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  db-data:
